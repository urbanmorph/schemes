name: Monthly run

# Cadence is monthly on purpose (PLAN.md §6). The Budget is annual, myScheme moves
# slowly, and weekly was never justified by the data's velocity — it only multiplied the
# request load against visibly fragile state infrastructure.
#
# workflow_dispatch is not just a convenience: in a public repo GitHub disables scheduled
# workflows after 60 days without repository activity, and a working collector is quiet
# by construction. A monthly data commit should reset that timer, but the docs do not
# confirm workflow-generated pushes count, so keep the manual trigger and act on the
# warning email if it arrives.

on:
  schedule:
    # 04:00 UTC on the 3rd, and again each day to the 7th. The extra days are not extra
    # collection: a month that finished clean exits in seconds (run.sh --if-needed), and
    # one that ran out of time continues where it stopped. One attempt a month meant one
    # slow host cost the month, which is what happened in October 2026.
    - cron: "0 4 3-7 * *"
  workflow_dispatch:
    inputs:
      pace:
        description: "Seconds between API requests"
        default: "0.7"

concurrency:
  group: collect
  cancel-in-progress: false     # never interrupt a run that is mid-archive

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    # Three limits, nested, so that each one fires before the one outside it:
    #   run.sh --deadline-min 300   collectors stop and leave 40 min to parse and build
    #   the pipeline step, 320 min  a hard stop if run.sh itself overruns
    #   this job, 350 min           leaves the Save step time to push what exists
    # The October 2026 run had only the outer one, so the job died holding a complete
    # myScheme snapshot and the step that would have committed it never ran.
    timeout-minutes: 350
    outputs:
      committed: ${{ steps.save.outputs.committed }}
    env:
      GIT_AUTHOR_NAME: schemes-collector
      GIT_AUTHOR_EMAIL: noreply@users.noreply.github.com
      GIT_COMMITTER_NAME: schemes-collector
      GIT_COMMITTER_EMAIL: noreply@users.noreply.github.com
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install poppler
        # pdftotext for the annual Budget statements. It does not exist in a Workers
        # runtime, which is one of the reasons collection lives here (PLAN.md §6).
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Restore this month's unfinished collection
        # A run that was stopped pushed what it had to wip/collect-YYYY-MM every ten
        # minutes (checkpoint.sh). Bring it back so this attempt continues it; myScheme's
        # collector keeps every whole record already on disk and fetches only the rest.
        run: |
          echo "WIP=wip/collect-$(date -u +%Y-%m)" >> "$GITHUB_ENV"
          ./checkpoint.sh restore "wip/collect-$(date -u +%Y-%m)"

      - name: Run the pipeline
        id: run
        timeout-minutes: 320
        env:
          MYSCHEME_KEY: ${{ secrets.MYSCHEME_KEY }}   # optional; falls back to the bundle key
          PACE: ${{ inputs.pace || '0.7' }}           # through env, never into the script
        # THIS STEP USED TO BE THREE, and they were the whole job: collect myScheme, verify,
        # run parse/explode.py. Nothing else. Not DBT, not the CAG catalogue, not one of the
        # fifteen state budgets, not the union registry, not any of the fifteen classifiers,
        # not sector, legibility, the CAG join, either enrichment, the change feed or the
        # site. The register's entire claim is an unattended monthly series and the
        # automation covered the first sixth of it.
        #
        # The 2026-09-03 snapshot is what that looks like from outside: it committed a fresh
        # myScheme census against a registry, fifteen classifications and a change feed all
        # derived from the day before, and nothing said so. Everything downstream had to be
        # re-derived by hand before it could be published.
        #
        # run.sh is the pipeline and it is what runs now. It records each failing step,
        # keeps going, publishes what succeeded and exits non-zero, so a broken source
        # costs that source and not the month. Exit 75 means a collector ran out of time
        # and the next attempt continues it.
        #
        # The exit code goes to an output rather than failing the step, so Save can tell
        # "finished, with failures" (1) from "unfinished" (75) from "killed" (no code).
        run: |
          set +e
          ( while sleep 600; do ./checkpoint.sh save "$WIP"; done ) &
          saver=$!
          ./run.sh --resume-month --if-needed --deadline-min 300 --pace "$PACE"
          code=$?
          kill "$saver" 2>/dev/null
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Save
        id: save
        # always(): this is the step the October 2026 run never reached. It decides where
        # this attempt's bytes go.
        #
        # To main when the run finished (0 or 1), or when it did not but the myScheme
        # snapshot is complete anyway: that snapshot is real, citable and fit to publish,
        # and holding it back while the CAG crawl retries would cost the month for one
        # secondary source. Otherwise to the side branch only, and main is untouched.
        #
        # A CAG walk without a manifest is deleted first: it cannot resume, and committed
        # it would be read as the newest catalogue.
        if: always()
        env:
          CODE: ${{ steps.run.outputs.code }}
        run: |
          echo "committed=false" >> "$GITHUB_OUTPUT"
          SNAP=$(python3 progress.py month-date)
          for d in archive/cag/*/; do [ -f "$d/_manifest.json" ] || rm -rf "$d"; done
          if [ "$CODE" = 0 ] || [ "$CODE" = 1 ] || python3 progress.py finished myscheme "$SNAP"; then
            git add -A -- archive data status.json
            [ -f run.json ] && git add -- run.json
            if git diff --cached --quiet; then
              echo "nothing changed"
            else
              VERDICT=$(python3 -c "import json;print(json.load(open('status.json'))['verdict'])")
              # The message says what the snapshot was, not what the run did, because a
              # run that half-failed still commits the archive it managed to fetch.
              # Whether the run was clean is the job's exit status and the step below.
              git commit -q -m "snapshot $SNAP — $VERDICT"
              git push -q
              echo "committed=true" >> "$GITHUB_OUTPUT"
            fi
            if python3 progress.py finished myscheme "$SNAP"; then ./checkpoint.sh drop "$WIP"; fi
          else
            ./checkpoint.sh save "$WIP"
          fi

      - name: Fail loudly if anything in the run failed
        # The alarm has to reach a human without anyone going to look for it. A failed job
        # emails; a dashboard does not. PLAN.md §8, §9.
        #
        # Keyed on run.sh's exit status rather than on verification alone, because a
        # snapshot can verify while the CAG crawl, a state parser or a classifier did not
        # run. run.sh names each failed step on stderr and in the job log above.
        #
        # An unfinished run before the 7th is a warning, because tomorrow's attempt
        # continues it and an email a day for a run that is working would teach you to
        # ignore the email. On the 7th, or for a manual run, unfinished is a failure.
        if: always()
        env:
          CODE: ${{ steps.run.outputs.code }}
          EVENT: ${{ github.event_name }}
        run: |
          [ "$CODE" = 0 ] && exit 0
          if { [ "$CODE" = 75 ] || [ -z "$CODE" ]; } && [ "$EVENT" = schedule ] && [ "$(date -u +%-d)" -lt 7 ]; then
            echo "::warning::The monthly run stopped before finishing; tomorrow's attempt continues it"
            exit 0
          fi
          echo "::error::The monthly run did not complete cleanly (exit ${CODE:-killed}) — see the log above"
          python3 -c "
          import json, os
          for f in ('run.json', 'status.json'):
              if os.path.exists(f):
                  d = json.load(open(f))
                  print(f'  {f}:', {k: d.get(k) for k in ('verdict', 'failed', 'stopped') if k in d})
          "
          exit 1

  # The monthly data commit is pushed with GITHUB_TOKEN, and a push made with that token
  # does not trigger other workflows. Without calling deploy here the month's collection
  # would land in the repository and never reach the site, which is the quiet failure this
  # whole project exists to notice in other people.
  #
  # It runs even when a step failed, because run.sh publishes what succeeded and a partial
  # month is still better on the site than last month's. It does not run when the snapshot
  # did not verify: an INCOMPLETE snapshot manufactures false change events (PLAN.md §8).
  #
  # Only when Save pushed something: the retry days that find the month already done,
  # and attempts that only checkpointed, have nothing new to publish.
  deploy:
    needs: collect
    if: always() && needs.collect.outputs.committed == 'true'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    with:
      reason: monthly snapshot

  # Repair runs only when collection failed, and only when a key is configured — so it
  # is inert until you opt in. It may propose changes to parse/ and open a PR. It must
  # never touch collect/, and it must never merge: the value of the archive is that
  # collection semantics do not drift, and a PR is where a human checks that (PLAN.md §7).
  repair:
    needs: collect
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      # `secrets` is not an available context in an `if:` condition — using it there makes
      # the whole workflow file invalid, and GitHub then fails it at parse time on every
      # push, with no jobs and no logs. Map the secret to an env var here (env: CAN read
      # secrets) and test that instead.
      HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose and open a PR
        if: env.HAS_KEY == 'true'
        run: |
          echo "Repair agent not yet wired. See PLAN.md §7 for the contract it must honour:"
          echo "  - may edit parse/ only; collect/ is frozen"
          echo "  - opens a PR, never merges"
          echo "  - a PR touching collect/ must be labelled and never auto-approved"
          exit 0
