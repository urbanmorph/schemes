name: Monthly run

# Cadence is monthly on purpose (PLAN.md §6). The Budget is annual, myScheme moves
# slowly, and weekly was never justified by the data's velocity — it only multiplied the
# request load against visibly fragile state infrastructure.
#
# workflow_dispatch is not just a convenience: in a public repo GitHub disables scheduled
# workflows after 60 days without repository activity, and a working collector is quiet
# by construction. A monthly data commit should reset that timer, but the docs do not
# confirm workflow-generated pushes count, so keep the manual trigger and act on the
# warning email if it arrives.

on:
  schedule:
    - cron: "0 4 3 * *"        # 04:00 UTC on the 3rd
  workflow_dispatch:
    inputs:
      pace:
        description: "Seconds between API requests"
        default: "0.7"

concurrency:
  group: collect
  cancel-in-progress: false     # never interrupt a run that is mid-archive

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180        # a full census is ~4,820 paced requests, about an hour

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install poppler
        # pdftotext for the annual Budget statements. It does not exist in a Workers
        # runtime, which is one of the reasons collection lives here (PLAN.md §6).
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Set snapshot date
        run: echo "SNAP=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"

      - name: Run the pipeline
        id: run
        env:
          MYSCHEME_KEY: ${{ secrets.MYSCHEME_KEY }}   # optional; falls back to the bundle key
        # THIS STEP USED TO BE THREE, and they were the whole job: collect myScheme, verify,
        # run parse/explode.py. Nothing else. Not DBT, not the CAG catalogue, not one of the
        # fifteen state budgets, not the union registry, not any of the fifteen classifiers,
        # not sector, legibility, the CAG join, either enrichment, the change feed or the
        # site. The register's entire claim is an unattended monthly series and the
        # automation covered the first sixth of it.
        #
        # The 2026-09-03 snapshot is what that looks like from outside: it committed a fresh
        # myScheme census against a registry, fifteen classifications and a change feed all
        # derived from the day before, and nothing said so. Everything downstream had to be
        # re-derived by hand before it could be published.
        #
        # run.sh is the pipeline and it is what runs now. It records each failing step,
        # keeps going, publishes what succeeded and exits non-zero, so a broken source
        # costs that source and not the month.
        continue-on-error: true
        run: ./run.sh --date "$SNAP" --pace "${{ inputs.pace || '0.7' }}"

      - name: Commit
        run: |
          git config user.name  "schemes-collector"
          git config user.email "noreply@users.noreply.github.com"
          git add -A archive data status.json
          if git diff --cached --quiet; then
            echo "nothing changed"; exit 0
          fi
          VERDICT=$(python3 -c "import json;print(json.load(open('status.json'))['verdict'])")
          # The message says what the snapshot was, not what the run did, because a run
          # that half-failed still commits the archive it managed to fetch. Whether the
          # run was clean is the job's exit status and the step below.
          git commit -m "snapshot $SNAP — $VERDICT"
          git push

      - name: Fail loudly if anything in the run failed
        # The alarm has to reach a human without anyone going to look for it. A failed job
        # emails; a dashboard does not. PLAN.md §8, §9.
        #
        # Keyed on run.sh's exit status rather than on verification alone, because a
        # snapshot can verify while the CAG crawl, a state parser or a classifier did not
        # run. run.sh names each failed step on stderr and in the job log above.
        if: steps.run.outcome != 'success'
        run: |
          echo "::error::The monthly run for $SNAP did not complete cleanly — see the log above"
          python3 -c "
          import json, os
          if os.path.exists('status.json'):
              d = json.load(open('status.json'))
              print('  verdict:', d.get('verdict'))
              for name, when, why in d.get('attention', []):
                  print(f'  {name}: {why}')
          "
          exit 1

  # Repair runs only when collection failed, and only when a key is configured — so it
  # is inert until you opt in. It may propose changes to parse/ and open a PR. It must
  # never touch collect/, and it must never merge: the value of the archive is that
  # collection semantics do not drift, and a PR is where a human checks that (PLAN.md §7).
  repair:
    needs: collect
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      # `secrets` is not an available context in an `if:` condition — using it there makes
      # the whole workflow file invalid, and GitHub then fails it at parse time on every
      # push, with no jobs and no logs. Map the secret to an env var here (env: CAN read
      # secrets) and test that instead.
      HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose and open a PR
        if: env.HAS_KEY == 'true'
        run: |
          echo "Repair agent not yet wired. See PLAN.md §7 for the contract it must honour:"
          echo "  - may edit parse/ only; collect/ is frozen"
          echo "  - opens a PR, never merges"
          echo "  - a PR touching collect/ must be labelled and never auto-approved"
          exit 0
