name: Deploy

# Deployment lives here and not on anybody's laptop.
#
# It used to be a wrangler command run by hand, which meant the person deploying held a
# Cloudflare token locally and nobody else could ship. Two developers and one secret is a
# bad arrangement: either the token gets passed around, or one person becomes the only
# route to production. The token is a repository secret now, scoped to Pages Edit on the
# urbanmorph account and nothing else, and no human needs a copy.
#
# Called, never triggered directly by a push, so there is exactly one answer to "what is
# deployed": whatever last passed checks on main, or whatever the monthly run produced.
# workflow_dispatch is kept for the case where the site needs rebuilding without a commit.

on:
  workflow_call:
    inputs:
      reason:
        description: "What is being deployed, for the run log"
        required: false
        type: string
        default: "push to main"
      ref:
        description: "What to check out. Empty means the commit that triggered the caller."
        required: false
        type: string
        default: ""
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Never two deploys at once, and never cancel one midway: a half-uploaded site is worse
  # than a stale one.
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # A called workflow shares its caller's github.sha. For the monthly run that is
          # the commit the schedule started on, before Save pushed the month's snapshot,
          # so without a ref the monthly deploy published last month's data/.
          ref: ${{ inputs.ref }}
          # The build reads data/, site/, parse/match.py, tools/check_links.py and the root
          # status.json. blob:none alone saved nothing: a depth-1 checkout still downloads
          # every blob at HEAD, archive/ included (0.72 GB, ~30 s a run). The sparse cone
          # leaves archive/ out entirely.
          filter: blob:none
          sparse-checkout: |
            data
            site
            parse
            tools
          # Nothing here pushes, and deploy runs npm code: keep the token out of .git/config.
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # Rebuilt here rather than carried from another job, because site/_out is not
      # committed and a deploy that publishes a stale artefact is the failure this is
      # meant to prevent.
      - name: Build the site
        run: python3 site/build.py

      - name: Every internal link resolves
        # The last gate before the public site. Cloudflare Pages answers an unknown path
        # with index.html and HTTP 200 unless 404.html exists, so a dead link does not
        # look like one: it serves the whole register under the wrong URL.
        run: python3 tools/check_links.py

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # THROUGH env, NEVER interpolated into the script. `reason` is a commit message,
          # which anybody who can push controls, and this job holds the deploy token: a
          # message containing $(...) or backticks would run in it. GitHub substitutes
          # ${{ }} into the shell source before bash sees it, so the only safe way to use
          # untrusted input in a run block is to bind it to a variable and quote it.
          REASON: ${{ inputs.reason || 'manual' }}
        run: |
          echo "deploying: $REASON"
          npx --yes wrangler@3.114.17 pages deploy site/_out \
            --project-name=india-schemes --branch=main

      - name: Confirm the deployed site answers
        # The edge serves stale under stale-while-revalidate, so a check straight after a
        # deploy can return the previous build. A cache-busting query is the difference
        # between checking the deploy and checking the cache.
        run: |
          for path in / /states /divergence /audit /changes; do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              "https://india-schemes.pages.dev${path}?cb=${GITHUB_SHA}")
            printf '  %-14s %s\n' "$path" "$code"
            [ "$code" = "200" ] || exit 1
          done
