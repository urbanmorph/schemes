name: Checks

# The monthly collection job is the wrong place to discover a broken parser: it runs once a
# month, it needs the network, and its failure costs a snapshot. This runs on every push and
# pull request, needs no network, and finishes in under a minute.
#
# It deliberately does NOT collect. Everything it checks is replayable against the archive
# already in the repository, which is the property PLAN.md §7 exists to protect.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  # Pull requests only. On main a newer push would cancel this whole run, and with it a
  # deploy midway through its upload, which deploy.yml exists to never do.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The site build reads data/ only; archive/ is 0.69 GB and not needed here.
          filter: blob:none
          # Nothing here pushes, and deploy runs npm code: keep the token out of .git/config.
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install the pinned poppler
        uses: ./.github/actions/poppler

      - name: Install PyMuPDF
        # tools/cag_mirror.py joins chaptered CAG reports and spots placeholder pages with
        # it, and its tests build PDFs with it. Same pin as collect.yml.
        run: pip install -q pymupdf==1.27.2

      - name: check.sh
        run: ./check.sh

      # run.sh itself, through a stopped, resumed and repeated month with every collector
      # stubbed. A minute, no network; until now nothing ran it.
      - name: run.sh chunks
        run: bash tests/run_chunks.sh

  # Deploy only what passed. A push to main that fails a check never reaches the public
  # site, and a pull request never deploys at all.
  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    with:
      reason: ${{ github.event.head_commit.message }}
